
name: Pay Calc CI

on:
  push:
    # Include active feature branches regardless of their naming convention.
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: JavaScript checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      # No install is needed today: the project has no dependencies or lockfile.
      - name: Install locked dependencies when present
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Verify JavaScript syntax
        run: npm run check:syntax

      - name: Unit tests — salary, tax, NI, pensions and periods
        run: npm run test:unit

      - name: Integration tests — form and dashboard
        run: npm run test:integration

      - name: Full regression suite
        run: npm test

      - name: Built-in coverage report
        if: matrix.node == 24
        run: npm run test:coverage
